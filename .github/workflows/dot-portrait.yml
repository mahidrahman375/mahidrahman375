name: Generate Animated Dot Portrait

on:
  push:
    paths:
      - assets/profile.png
      - scripts/animate_dotify.py
      - .github/workflows/dot-portrait.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "Pillow>=10.0"

      - name: Generate animation
        run: >
          python scripts/animate_dotify.py
          --input assets/profile.png
          --output assets/portrait-animation.gif
          --cols 78
          --frames 16
          --duration 90
          --detail 0.62
          --color
          --size 720

      - name: Commit GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portrait-animation.gif
          git diff --cached --quiet || git commit -m "Regenerate animated dot portrait"
          git push
